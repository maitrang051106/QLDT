[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: Depends()/Query() làm giá trị mặc định là cách dùng chuẩn của FastAPI
# E501: bỏ giới hạn độ dài dòng (chú thích tiếng Việt)
# UP007/UP045: SQLAlchemy relationship cần Optional["X"] dạng chuỗi
ignore = ["B008", "E501", "UP007", "UP042", "UP045", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
