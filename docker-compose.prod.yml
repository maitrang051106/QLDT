# Chạy trên server (do job deploy chép lên ~/course-registration và chạy).
# Cần file .env cùng thư mục, TẠO TAY MỘT LẦN trên server (không commit):
#   MYSQL_ROOT_PASSWORD=...   MYSQL_PASSWORD=...
#   JWT_SECRET=...            (chuỗi ngẫu nhiên >= 32 ký tự, vd: openssl rand -hex 32)
# REGISTRY_IMAGE và IMAGE_TAG do job deploy truyền vào.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qldt}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["dbdata:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qldt}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in .env}
      MYSQL_HOST: db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      MIN_CREDITS_PER_SEMESTER: ${MIN_CREDITS_PER_SEMESTER:-12}
      MAX_CREDITS_PER_SEMESTER: ${MAX_CREDITS_PER_SEMESTER:-24}
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"]

  frontend:
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose: ["80"]

  gateway:
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }

volumes:
  dbdata:
