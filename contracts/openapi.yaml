components:
  schemas:
    AttendanceEntry:
      properties:
        studentId:
          type: integer
          title: Studentid
        studentCode:
          type: string
          title: Studentcode
        fullName:
          type: string
          title: Fullname
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        status:
          anyOf:
          - $ref: '#/components/schemas/AttendanceStatus'
          - type: 'null'
      type: object
      required:
      - studentId
      - studentCode
      - fullName
      - email
      - status
      title: AttendanceEntry
    AttendanceSheet:
      properties:
        sectionId:
          type: integer
          title: Sectionid
        sectionCode:
          type: string
          title: Sectioncode
        classDate:
          type: string
          format: date
          title: Classdate
        scheduledDates:
          items:
            type: string
            format: date
          type: array
          title: Scheduleddates
        items:
          items:
            $ref: '#/components/schemas/AttendanceEntry'
          type: array
          title: Items
      type: object
      required:
      - sectionId
      - sectionCode
      - classDate
      - scheduledDates
      - items
      title: AttendanceSheet
    AttendanceStatus:
      type: string
      enum:
      - PRESENT
      - ABSENT
      - LATE
      - EXCUSED
      title: AttendanceStatus
    AttendanceUpdateItem:
      properties:
        studentId:
          type: integer
          title: Studentid
        status:
          $ref: '#/components/schemas/AttendanceStatus'
      type: object
      required:
      - studentId
      - status
      title: AttendanceUpdateItem
    AttendanceUpdateRequest:
      properties:
        classDate:
          type: string
          format: date
          title: Classdate
        items:
          items:
            $ref: '#/components/schemas/AttendanceUpdateItem'
          type: array
          title: Items
      type: object
      required:
      - classDate
      - items
      title: AttendanceUpdateRequest
    AuthResponse:
      properties:
        accessToken:
          type: string
          title: Accesstoken
        tokenType:
          type: string
          title: Tokentype
          default: Bearer
        expiresIn:
          type: integer
          title: Expiresin
        user:
          $ref: '#/components/schemas/UserInfo'
      type: object
      required:
      - accessToken
      - expiresIn
      - user
      title: AuthResponse
    ConflictRange:
      properties:
        start:
          type: integer
          title: Start
        end:
          type: integer
          title: End
      type: object
      required:
      - start
      - end
      title: ConflictRange
    CurrentSemester:
      properties:
        id:
          type: integer
          title: Id
        semesterCode:
          type: string
          title: Semestercode
        name:
          type: string
          title: Name
        startDate:
          type: string
          format: date
          title: Startdate
        endDate:
          type: string
          format: date
          title: Enddate
        numWeeks:
          type: integer
          title: Numweeks
        currentWeek:
          anyOf:
          - type: integer
          - type: 'null'
          title: Currentweek
      type: object
      required:
      - id
      - semesterCode
      - name
      - startDate
      - endDate
      - numWeeks
      - currentWeek
      title: CurrentSemester
    CurrentUserResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
      type: object
      required:
      - user
      title: CurrentUserResponse
    ErrorResponse:
      properties:
        status:
          type: integer
          title: Status
