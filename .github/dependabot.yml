# Tự mở PR cập nhật phiên bản (action, thư viện Python, image Docker) mỗi tuần
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /gateway
    schedule: { interval: weekly }
